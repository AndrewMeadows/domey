[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "domey"
version = "0.1.0"
description = "Compute and visualize vertices and arcs of geodesic spheres based on twist-truncated regular polyhedra"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["geodesic", "polyhedron", "geometry", "dome", "platonic-solids"]

# The src compute library is pure Python plus PyGLM. The app/viewer stack lives
# in the optional "app" extra so the compute library installs without OpenGL deps.
dependencies = [
    "PyGLM>=2.5.0",
]

[project.optional-dependencies]
app = [
    "moderngl>=5.12",
    "moderngl-window>=3.1",
    "numpy>=1.24",
    "imgui-bundle<1.92",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
domey = "app.__main__:main"

[project.urls]
Homepage = "https://github.com/yourusername/domey"
Repository = "https://github.com/yourusername/domey"
Issues = "https://github.com/yourusername/domey/issues"

[tool.setuptools]
packages = ["src", "app"]

[tool.setuptools.package-data]
app = ["shaders/*.vert", "shaders/*.frag"]
